name: Bug Report
description: Report a defect against an SRS requirement or test case
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: srs_tc
    attributes:
      label: Linked SRS Requirement / Test Case ID
      placeholder: "e.g., FR-22 / TC-F13"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
    validations:
      required: true
