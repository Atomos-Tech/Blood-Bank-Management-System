name: PR Automation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-hygiene:
    name: Label, assign and validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-assign PR author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-assignee "$PR_AUTHOR" || true

      - name: Auto-label PR by modified files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Validate linked issue in PR description or title
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          combined="${PR_TITLE} ${PR_BODY}"
          if echo "$combined" | grep -Eiq '(closes|fixes|resolves)\s+#[0-9]+|BB-[0-9]+'; then
            echo "PR links a backlog issue."
          else
            echo "::error::PR description or title must reference a backlog issue (e.g., 'Closes #26' or 'BB-24')."
            exit 1
          fi
