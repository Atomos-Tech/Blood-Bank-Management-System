name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-check-test:
    name: Lint, check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blood-bank-management-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: blood-bank-management-system/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Run flake8 fatal syntax & undefined-name checks
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations and seed demo data
        run: |
          python manage.py migrate
          python manage.py seed_demo

      - name: Run automated test suite
        run: python manage.py test bloodbank -v 2
