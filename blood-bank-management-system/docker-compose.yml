services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bbms
      POSTGRES_USER: bbms
      POSTGRES_PASSWORD: change-before-deployment
    volumes: [postgres_data:/var/lib/postgresql/data]
  web:
    build: .
    command: gunicorn bbms.wsgi:application --bind 0.0.0.0:8000
    environment:
      BBMS_DB_ENGINE: postgresql
      POSTGRES_DB: bbms
      POSTGRES_USER: bbms
      POSTGRES_PASSWORD: change-before-deployment
      POSTGRES_HOST: db
      BBMS_SECURE_SSL: "1"
      BBMS_DEBUG: "0"
    depends_on: [db]
  scheduler:
    # Scheduled tasks share the application code but run as a separate process (SADS 3.4).
    build: .
    command: python manage.py expire_units --every 300
    environment:
      BBMS_DB_ENGINE: postgresql
      POSTGRES_DB: bbms
      POSTGRES_USER: bbms
      POSTGRES_PASSWORD: change-before-deployment
      POSTGRES_HOST: db
      BBMS_DEBUG: "0"
    depends_on: [db]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./certs:/etc/nginx/certs:ro"
    depends_on: [web]
volumes:
  postgres_data:
