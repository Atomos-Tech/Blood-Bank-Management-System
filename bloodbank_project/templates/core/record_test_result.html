{% extends "base.html" %}
{% block content %}
<div class="container-narrow">
  <div class="page-head"><div><h1>Lab test result</h1><p>Donation #{{ donation.id }} · {{ donation.donor }} · {{ donation.donor.blood_group }}</p></div></div>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" style="width:100%; margin-top:18px;" type="submit">Save result</button>
    </form>
  </div>
</div>
{% endblock %}
