{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>Search availability</h1><p>Live stock by blood group across branches.</p></div></div>
<form method="get" style="display:flex; gap:10px; margin-bottom:24px; max-width:420px;">
  <select name="branch" onchange="this.form.submit()">
    <option value="">All branches</option>
    {% for b in branches %}<option value="{{ b.id }}" {% if selected_branch == b.id|stringformat:"s" %}selected{% endif %}>{{ b }}</option>{% endfor %}
  </select>
</form>
<div class="stat-strip">
  {% for group, count in counts.items %}
  <div class="stat-tile {% if count == 0 %}low{% endif %}"><div class="num">{{ count }}</div><div class="lbl">{{ group }}</div></div>
  {% endfor %}
</div>
<a href="{% url 'create_request' %}" class="btn btn-primary">Request blood</a>
{% endblock %}
