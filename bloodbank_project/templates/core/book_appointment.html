{% extends "base.html" %}
{% block content %}
<div class="container-narrow">
  <div class="page-head"><div><h1>Book a donation appointment</h1><p>Pick a branch, date, and time that works for you.</p></div></div>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" style="width:100%; margin-top:18px;" type="submit">Book appointment</button>
    </form>
  </div>
</div>
{% endblock %}
