{% extends "base.html" %}
{% block content %}
<div class="container-narrow">
  <div class="page-head"><div><h1>Record a blood donation</h1><p>Logs the donation and queues it for lab testing.</p></div></div>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" style="width:100%; margin-top:18px;" type="submit">Save donation</button>
    </form>
  </div>
</div>
{% endblock %}
