{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>Branches</h1><p>All blood bank locations in the network.</p></div></div>
<div class="grid-2">
  {% for b in branches %}
  <div class="panel">
    <h3 style="margin-bottom:6px;">{{ b.name }}</h3>
    <p class="muted small" style="margin:0;">{{ b.city }}<br>{{ b.address }}<br>{{ b.contact_phone }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
