{% extends "base.html" %}
{% block content %}
<div class="container-narrow">
  <div class="page-head"><div><h1>System settings</h1><p>These rules apply platform-wide — donor eligibility, unit shelf life, and stock alerts.</p></div></div>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" style="width:100%; margin-top:18px;" type="submit">Save settings</button>
    </form>
  </div>
</div>
{% endblock %}
