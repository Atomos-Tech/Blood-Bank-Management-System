{% extends "base.html" %}
{% block content %}
<div class="container-narrow">
  <div class="page-head">
    <div>
      <h1>Register your hospital</h1>
      <p>Search live blood availability and submit requests once you're signed in.</p>
    </div>
  </div>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" style="width:100%; margin-top:18px;" type="submit">Create hospital account</button>
    </form>
  </div>
</div>
{% endblock %}
